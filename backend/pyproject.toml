[project]
name = "agentbase-backend"
version = "0.1.0"
description = "Agent Base backend: policy engine, agent runtime, executor, webhooks"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "solana>=0.42",
    "solders>=0.29",
    "uvicorn>=0.30",
    "websockets>=13",
    "x402[svm,httpx]>=2.27,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
